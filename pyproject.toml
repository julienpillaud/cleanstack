[project]
name = "cleanstack"
# use dynamic version to avoid sync issues with uv.lock after 'release-please'
dynamic = ["version"]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13",
]

[project.optional-dependencies]
mongo = [
    "pymongo>=4.17",
]
sql = [
    "psycopg[binary]>=3.3",
    "sqlalchemy[asyncio]>=2.0",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.6",
    "ty==0.0.78",
    "apte",
    "fastapi[standard]==0.141.1",
    "pydantic-settings==2.15.0",
    "httpx2==2.12.0",
    "asgi-lifespan==2.1.0",
]

[tool.uv.sources]
apte = { git = "https://github.com/renaudcepre/apte.git", tag = "apte-v0.3.1" }

[tool.setuptools.packages.find]
include = ["cleanstack*"]

[tool.ruff]
output-format = "concise"
[tool.ruff.lint]
select = [
    "E", "W", # pycodestyle
    "F", # Pyflakes
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "SIM", # flake8-simplify
    "I", # isort
    "PL", # Pylint
    "RUF",
    "ANN", # flake8-annotations
]
ignore = [
    "PLR0911", # Too many return statements (7 > 6)
    "PLR0913", # Too many arguments in function definition (6 > 5)
    "PLR0917", # Too many positional arguments (7 > 5)
]

[tool.ty.terminal]
output-format = "concise"

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[tool.mypy]
strict = true
disable_error_code = [
    "prop-decorator",
]
plugins = ['pydantic.mypy']

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true
log_cli_level = "info"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)30s - %(message)s"
log_file = ".pytest_cache/tests.log"
log_file_level = "info"
log_format = "%(asctime)s [%(levelname)8s] %(name)30s - %(message)s"
